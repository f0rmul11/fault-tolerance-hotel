apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: hotelflow
servers: 1
agents: 0
image: rancher/k3s:v1.35.2-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6550"
ports:
  - port: "127.0.0.1:8080:80"
    nodeFilters:
      - loadbalancer
  - port: "127.0.0.1:9090:30090"
    nodeFilters:
      - loadbalancer
  - port: "127.0.0.1:8081:30081"
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
