syntax = "proto3";

package notification.echo.v1;

option go_package = "notification/internal/pkg/pb/notification/echo/v1;echoV1";

service EchoService {
  // Проверяет доступность gRPC и возвращает исходное сообщение и имя сервиса.
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  string service = 2;
}
