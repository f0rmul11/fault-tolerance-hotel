graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

kafka_brokers:
  - kafka:9092
consumer_group: notification-booking-events
# Уведомления выводятся в stdout, внешнего провайдера нет.
service: {}

telemetry:
  metrics_enabled: true
  metrics_interval: 15s
  logs_enabled: true
  log_level: info
  enabled: false
  service_name: notification
  service_namespace: hotelflow
  otlp_endpoint: otel-collector:4317
  otlp_insecure: true
