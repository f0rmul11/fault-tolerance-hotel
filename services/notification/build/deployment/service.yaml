apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30095
---
apiVersion: v1
kind: Service
metadata:
  name: notification-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30086
