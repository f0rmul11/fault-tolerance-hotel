graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  hotels: "hotels:9090"

postgres_dsn: "postgres://booking:booking-local@booking-postgres:5432/booking?sslmode=disable"

kafka_brokers: ["localhost:9092"]

postgres:
  max_connections: 10
  min_connections: 0
  max_idle_connections: 0
  max_conn_lifetime: 1h
outbox:
  limits:
    locked_keys_limit: 100
    messages_limit: 100
    max_err_count_for_message: 10
  topics:
    booking.events.v1:
      batch_size: 50
      worker:
        interval: 1s
        concurrency: 1

consumer_group: "booking-checkin-events"
inbox:
  config:
    messages_limit: 100
    max_err_count_for_message: 5
    normal_messages_poll_interval: 1s
    error_messages_poll_interval: 5s
  topics:
    checkin.events.v1:
      batch_size: 1
