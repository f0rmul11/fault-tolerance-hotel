apiVersion: v1
kind: Service
metadata:
  name: booking
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: booking
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30092
---
apiVersion: v1
kind: Service
metadata:
  name: booking-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: booking
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30083
