apiVersion: v1
kind: Service
metadata:
  name: availability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: availability
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30091
---
apiVersion: v1
kind: Service
metadata:
  name: availability-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: availability
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30082
