apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app.kubernetes.io/name: review
    app.kubernetes.io/part-of: hotelflow
  name: review
spec:
  minReadySeconds: 5
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: review-rollout
  strategy:
    canary:
      abortScaleDownDelaySeconds: 30
      maxSurge: 3
      maxUnavailable: 0
      scaleDownDelaySeconds: 30
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 0
      - pause: {}
      - setCanaryScale:
          matchTrafficWeight: true
      - setWeight: 10
      - pause: {}
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 100
      - pause: {}
      trafficRouting:
        istio:
          destinationRule:
            canarySubsetName: canary
            name: review-canary
            stableSubsetName: stable
          virtualService:
            name: review-canary
            routes:
            - primary
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"terminationDrainDuration":"35s"}'
        traffic.sidecar.istio.io/includeInboundPorts: "9090"
        traffic.sidecar.istio.io/includeOutboundIPRanges: ""
        traffic.sidecar.istio.io/includeOutboundPorts: "9090"
      labels:
        app.kubernetes.io/name: review-rollout
        app.kubernetes.io/part-of: hotelflow
        sidecar.istio.io/inject: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OTEL_SERVICE_NAME
          value: review
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=hotelflow,deployment.environment.name=lab,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: otel-collector.hotelflow.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
        - name: TELEMETRY_ENABLED
          value: "true"
        - name: TELEMETRY_LOGS_ENABLED
          value: "true"
        - name: LOG_LEVEL
          value: info
        - name: OTEL_BLRP_MAX_QUEUE_SIZE
          value: "2048"
        - name: OTEL_BLRP_MAX_EXPORT_BATCH_SIZE
          value: "512"
        - name: OTEL_BLRP_SCHEDULE_DELAY
          value: "1000"
        - name: OTEL_BLRP_EXPORT_TIMEOUT
          value: "3000"
        - name: TELEMETRY_METRICS_ENABLED
          value: "true"
        - name: TELEMETRY_METRICS_INTERVAL
          value: 15s
        - name: OTEL_METRIC_EXPORT_TIMEOUT
          value: "3000"
        - name: OTEL_BSP_MAX_QUEUE_SIZE
          value: "2048"
        - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
          value: "512"
        - name: OTEL_BSP_SCHEDULE_DELAY
          value: "1000"
        - name: OTEL_BSP_EXPORT_TIMEOUT
          value: "3000"
        - name: GRPC_PORT
          value: "9090"
        - name: ADMIN_HTTP_PORT
          value: "8081"
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              key: dsn
              name: review-database
        image: hotelflow/review:local
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthcheck/live
            port: admin
          periodSeconds: 10
        name: review
        ports:
        - containerPort: 9090
          name: grpc
          protocol: TCP
        - containerPort: 8081
          name: admin
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /healthcheck/ready
            port: admin
          periodSeconds: 2
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthcheck/startup
            port: admin
          periodSeconds: 1
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
