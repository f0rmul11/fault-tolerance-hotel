graceful:
  delay: 3s
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

# Echo has no downstream dependencies yet.
service: {}

postgres_dsn: "postgres://review:review-local@review-postgres:5432/review?sslmode=disable"
postgres:
  max_connections: 10
  min_connections: 0
  max_idle_connections: 0
  max_conn_lifetime: 1h

telemetry:
  metrics_enabled: true
  metrics_interval: 3s
  logs_enabled: true
  log_level: info
  enabled: false
  service_name: review
  service_namespace: hotelflow
  otlp_endpoint: otel-collector:4317
  otlp_insecure: true

# Старый limiter без изменений: Vegas + ограниченная LIFO-очередь.
# Конфигурация читается при запуске; изменение требует рестарта Review.
load_shedding:
  __default__:
    enabled: false
    separate_hr_per_handler_enabled: true
  handlers:
    - method: /review.review.v1.ReviewService/GetHotelRatings
      enabled: true
      limiter:
        window_size: 100
        min_window_time: 1s
        max_window_time: 2s
        min_rtt_threshold: 1ms
        max_backlog_size: 100
        max_backlog_wait_time: 200ms
      vegas:
        initial_max_inflight_limit: 40
        max_inflight_limit: 200
        smoothing: 1.0
        alpha_func_coefficient: 6
        beta_func_coefficient: 12
        rtt_no_load_probe_multiplier: 1000
