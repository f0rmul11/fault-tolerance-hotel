graceful:
  delay: 3s
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  hotels: "hotels:9090"
  check-in: "check-in:9090"
  booking: booking:9090

telemetry:
  metrics_enabled: true
  metrics_interval: 15s
  logs_enabled: true
  log_level: info
  enabled: false
  service_name: api-gateway
  service_namespace: hotelflow
  otlp_endpoint: otel-collector:4317
  otlp_insecure: true

retry:
  __default__:
    enabled: false
    separate_retry_per_handler_enabled: false
    max_attempts: 3
    initial_backoff: 200ms
    max_backoff: 1s
    backoff_multiplier: 2
    retryable_codes: [Unavailable]
    throttler:
      throttling_enabled: true
      throttle_max_tokens: 10
      throttle_token_ratio: 0.1
  handlers:
    - method: /booking.booking.v1.BookingService/CreateBooking
      enabled: false # Для показа retry переключить на true.
