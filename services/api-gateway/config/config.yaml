graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  hotels: "hotels:9090"
  check-in: "check-in:9090"
  booking: booking:9090

# Для локального запуска через make config-etcd. В k3s endpoint задан в Deployment.
runtime_config:
  endpoints: ["http://127.0.0.1:2379"]
  prefix: /hotelflow/dev/services/api-gateway/rtconfig/v1/values/
  schema_path: rtconfig.yaml
  startup_timeout: 5s
  shutdown_timeout: 3s
