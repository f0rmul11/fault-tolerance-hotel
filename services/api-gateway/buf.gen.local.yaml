version: v2
clean: true
# Versions are pinned in build/Dockerfile.codegen.
plugins:
  - local: protoc-gen-go
    out: internal/pkg/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/pkg/pb
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local: protoc-gen-grpc-gateway
    out: internal/pkg/pb
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: internal/pkg/pb
    opt: fqn_for_openapi_name=true
  - local: protoc-gen-goclay
    out: internal/pkg/pb
    opt: paths=source_relative
inputs:
  - directory: api
