apiVersion: v1
kind: Service
metadata:
  name: check-in
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: check-in
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30093
---
apiVersion: v1
kind: Service
metadata:
  name: check-in-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: check-in
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30084
