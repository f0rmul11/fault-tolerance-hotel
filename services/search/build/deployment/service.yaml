apiVersion: v1
kind: Service
metadata:
  name: search
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: search
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30096
---
apiVersion: v1
kind: Service
metadata:
  name: search-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: search
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30087
