graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  review: "review:9090"

postgres_dsn: "postgres://hotels:hotels-local@hotels-postgres:5432/hotels?sslmode=disable"
postgres:
  max_connections: 10
  min_connections: 0
  max_idle_connections: 0
  max_conn_lifetime: 1h

telemetry:
  metrics_enabled: true
  metrics_interval: 15s
  logs_enabled: true
  log_level: info
  enabled: false
  service_name: hotels
  service_namespace: hotelflow
  otlp_endpoint: otel-collector:4317
  otlp_insecure: true
