graceful:
  delay: 3s
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  review: "review:9090"

postgres_dsn: "postgres://hotels:hotels-local@hotels-postgres:5432/hotels?sslmode=disable"
postgres:
  max_connections: 10
  min_connections: 0
  max_idle_connections: 0
  max_conn_lifetime: 1h

# Для локального запуска через make config-etcd. В k3s endpoint задан в Deployment.
runtime_config:
  endpoints: ["http://127.0.0.1:2379"]
  prefix: /hotelflow/dev/services/hotels/rtconfig/v1/values/
  schema_path: rtconfig.yaml
  startup_timeout: 5s
  shutdown_timeout: 3s

telemetry:
  metrics_enabled: true
  metrics_interval: 15s
  logs_enabled: true
  log_level: info
  enabled: false
  service_name: hotels
  service_namespace: hotelflow
  otlp_endpoint: otel-collector:4317
  otlp_insecure: true

circuit:
  __default__:
    enabled: false
    separate_circuit_per_handler_enabled: true
  handlers:
    - method: /review.review.v1.ReviewService/GetHotelRatings
      enabled: false
      max_requests: 1
      timeout: 5s
      interval: 20s
      bucket_period: 5s
      threshold_consecutive: 3
      threshold_percentage: 100
      failure_codes: [Unavailable, DeadlineExceeded]

review_fallback:
  enabled: false
