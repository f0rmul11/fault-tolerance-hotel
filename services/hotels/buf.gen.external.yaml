version: v2
clean: true
# Generate clients directly from the provider's local contract.
plugins:
  - local: protoc-gen-go
    out: internal/pkg/pb/external
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/pkg/pb/external
    opt: paths=source_relative
inputs:
  - directory: ../review/api
    paths:
      - ../review/api/review/review/v1/review.proto
