apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: hotelflow
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: hotelflow
        app.kubernetes.io/component: observability
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: admin-user}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: admin-password}
            - name: GF_PATHS_CONFIG
              value: /etc/hotelflow-grafana/grafana.ini
          ports:
            - {name: ui, containerPort: 3000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/hotelflow-grafana, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
          startupProbe:
            httpGet: {path: /api/health, port: ui}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /api/health, port: ui}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: ui}
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: config
          configMap: {name: grafana-config}
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap: {name: grafana-datasources}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/part-of: hotelflow
    app.kubernetes.io/component: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: ui, port: 3000, targetPort: ui, nodePort: 30300}
