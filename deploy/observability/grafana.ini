; Grafana 13.2.4. Credentials come from Kubernetes Secret.
[server]
http_port = 3000
root_url = http://localhost:3000/

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false


[plugins]
preinstall_disabled = true
preinstall_auto_update = false
