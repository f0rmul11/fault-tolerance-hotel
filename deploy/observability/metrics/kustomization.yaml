apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hotelflow
resources:
  - ../logs
  - prometheus-workload.yaml
configMapGenerator:
  - name: otel-collector-config
    behavior: replace
    files:
      - config.yaml=collector.yaml
  - name: prometheus-config
    files:
      - prometheus.yaml
  - name: grafana-datasources
    behavior: replace
    files:
      - datasources.yaml=grafana-datasources.yaml
