apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hotelflow
resources:
  - namespace.yaml
  - collector-workload.yaml
  - jaeger-workload.yaml
  - loki-workload.yaml
  - grafana-workload.yaml
  - prometheus-workload.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=collector.yaml
  - name: jaeger-config
    files:
      - config.yaml=jaeger.yaml
  - name: loki-config
    files:
      - config.yaml=loki.yaml
  - name: grafana-config
    files:
      - grafana.ini
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
  - name: prometheus-config
    files:
      - prometheus.yaml
  - name: grafana-dashboard-providers
    files:
      - dashboards.yaml=grafana-dashboards.yaml
  - name: grafana-dashboards
    files:
      - service-overview.json=dashboards/service-overview.json
