# Tracing infrastructure in namespace hotelflow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hotelflow
resources:
  - namespace.yaml
  - collector-workload.yaml
  - jaeger-workload.yaml
  - grafana-port-reservation.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=collector.yaml
  - name: jaeger-config
    files:
      - config.yaml=jaeger.yaml
