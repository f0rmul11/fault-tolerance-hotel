# Reserve NodePort now; no Grafana workload until phase 2.
# Do not report this deliberately endpoint-less Service as an installation failure.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/part-of: hotelflow
    app.kubernetes.io/component: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: ui, port: 3000, targetPort: ui, nodePort: 30300}
