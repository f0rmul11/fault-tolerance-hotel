apiVersion: v1
kind: Service
metadata:
  name: envoy
spec:
  selector:
    app.kubernetes.io/name: envoy
  ports:
    - {name: gateway-booking, port: 10001, targetPort: 10001}
    - {name: gateway-hotels, port: 10002, targetPort: 10002}
    - {name: gateway-checkin, port: 10003, targetPort: 10003}
    - {name: booking-hotels, port: 10004, targetPort: 10004}
    - {name: hotels-review, port: 10005, targetPort: 10005}
