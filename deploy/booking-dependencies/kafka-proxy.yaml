apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-proxy
data:
  proxies.json: |
    [
      {"name":"broker-1","listen":"0.0.0.0:19091","upstream":"kafka-1:19092","enabled":true},
      {"name":"broker-2","listen":"0.0.0.0:19092","upstream":"kafka-2:19092","enabled":true},
      {"name":"broker-3","listen":"0.0.0.0:19093","upstream":"kafka-3:19092","enabled":true}
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-proxy
spec:
  selector:
    app.kubernetes.io/name: kafka-proxy
  ports:
    - {name: control, port: 8474, targetPort: 8474}
    - {name: broker-1, port: 19091, targetPort: 19091}
    - {name: broker-2, port: 19092, targetPort: 19092}
    - {name: broker-3, port: 19093, targetPort: 19093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.13.0
          args: ["-host", "0.0.0.0", "-config", "/config/proxies.json"]
          ports:
            - {name: control, containerPort: 8474}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
          readinessProbe:
            httpGet: {path: /version, port: control}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: kafka-proxy}
