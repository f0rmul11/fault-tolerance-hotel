apiVersion: v1
kind: Service
metadata:
  name: akhq
spec:
  selector:
    app.kubernetes.io/name: akhq
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akhq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akhq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akhq
    spec:
      automountServiceAccountToken: false
      containers:
        - name: akhq
          image: tchiotludo/akhq:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AKHQ_CONFIGURATION
              value: |
                akhq:
                  connections:
                    hotelflow:
                      properties:
                        bootstrap.servers: "kafka:9092"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
