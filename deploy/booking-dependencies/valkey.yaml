apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
data:
  valkey.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    dir /data
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-require-full-coverage yes
    cluster-allow-reads-when-down no
    cluster-announce-port 6379
    cluster-announce-bus-port 16379
    cluster-preferred-endpoint-type hostname
    appendonly yes
    appendfsync everysec
    save ""
    maxmemory 128mb
    maxmemory-policy noeviction
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: client
      port: 6379
    - name: cluster-bus
      port: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: client
      port: 6379
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
spec:
  serviceName: valkey-headless
  replicas: 6
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.8-alpine@sha256:139d21c97b1a956e42e29b1e4ede4752a6ff52d1a0db9ef0ff4954a570f23976
          command: [sh, -ec]
          args:
            - |
              exec valkey-server /etc/valkey/valkey.conf \
                --cluster-announce-ip "$POD_IP" \
                --cluster-announce-hostname "$POD_NAME.valkey-headless.hotelflow.svc.cluster.local"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: client
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [sh, -ec, 'test "$(valkey-cli ping)" = PONG']
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            exec:
              command: [sh, -ec, 'test "$(valkey-cli ping)" = PONG']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [sh, -ec, 'valkey-cli cluster info | grep -q "cluster_state:ok"']
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
# Только доверенный учебный namespace; наружу порты не публикуются.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 16379
