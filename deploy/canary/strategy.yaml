# Merged into the existing Review pod template by hotelctl canary setup.
replicas: 3
revisionHistoryLimit: 3
minReadySeconds: 5
strategy:
  canary:
    maxUnavailable: 0
    maxSurge: 3
    scaleDownDelaySeconds: 30
    abortScaleDownDelaySeconds: 30
    trafficRouting:
      istio:
        virtualService:
          name: review-canary
          routes: [primary]
        destinationRule:
          name: review-canary
          stableSubsetName: stable
          canarySubsetName: canary
    steps:
      - setCanaryScale: {replicas: 1}
      - setWeight: 0
      - pause: {}
      - setCanaryScale: {matchTrafficWeight: true}
      - setWeight: 10
      - pause: {}
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 100
      - pause: {}
